services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    privileged: true
    volumes:
      - ollama:/root/.ollama
    networks:
      - ollama-net
    environment:
      - OLLAMA_HOST=0.0.0.0:11434

volumes:
  ollama:

networks:
  ollama-net:
    external: true
