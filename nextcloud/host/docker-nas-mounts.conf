# /etc/systemd/system/docker.service.d/nas-mounts.conf
# Start Docker after the Nextcloud NAS mount. "Wants", not "Requires": if the NAS is
# down, Docker (and every other service on this host) still starts; Nextcloud then
# fails safely because its data dir lacks the .ncdata marker and the mountpoint is
# immutable.
[Unit]
Wants=mnt-nextcloud.mount
After=mnt-nextcloud.mount
