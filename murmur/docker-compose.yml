services:

  murmur:
    image: ghcr.io/readmurmur/murmur:latest
    container_name: murmur
    restart: unless-stopped
    depends_on:
      murmur-postgres:
        condition: service_healthy
    ports:
      - "9010:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://murmur:${POSTGRES_PASSWORD}@murmur-postgres:5432/murmur
      DATA_DIR: /data
    volumes:
      - ./data/murmur:/data
    networks:
      - internal
      - ollama-net

  murmur-postgres:
    image: pgvector/pgvector:pg17
    container_name: murmur-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: murmur
      POSTGRES_USER: murmur
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U murmur -d murmur"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

networks:
  internal:
  ollama-net:
    external: true
