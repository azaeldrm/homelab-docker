# STOPPED 2026-10-05: replaced by the `strata` service, which now owns port 11435 and both GPUs. Do not start both.
# To go back: `mc strata d`, then `mc llama-cpp u` (see /srv/code/benchmarks/strata/hosting/RUNBOOK.md, section "Going back").
services:
  llama-cpp:
    image: ${IMAGE}
    container_name: llama-cpp
    restart: unless-stopped

    ports:
      - "127.0.0.1:${HOST_PORT}:8080"
      - "${TAILSCALE_IP}:${HOST_PORT}:8080"

    volumes:
      - ./data/models:/models:ro

    command:
      # Router mode: do not pass -m/--model here.
      - --models-dir
      - /models
      - --models-max
      - "${MODELS_MAX}"
      # Keep the single configured model ready for Hermes after each restart.
      - --models-autoload
      - --jinja
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "${CTX_SIZE}"
      - --n-gpu-layers
      - "${GPU_LAYERS}"
      - --split-mode
      - "${SPLIT_MODE}"
      - --tensor-split
      - "${TENSOR_SPLIT}"
      - -np
      - "${PARALLEL}"
      - --temp
      - "${TEMP}"
      - --top-p
      - "${TOP_P}"
      - --top-k
      - "${TOP_K}"
      - --min-p
      - "${MIN_P}"
      - --kv-unified
      - --cache-type-k
      - "${CACHE_TYPE_K}"
      - --cache-type-v
      - "${CACHE_TYPE_V}"
      - --flash-attn
      - "${FLASH_ATTN}"
      - --fit
      - "${FIT}"
      - --no-context-shift
      # Speculative decoding: none | draft-mtp | ngram-mod | draft-mtp,ngram-mod (see .env)
      - --spec-type
      - "${SPEC_TYPE:-none}"

    gpus: all
    # Tensor split mode moves data between the GPUs with NCCL, which needs more than Docker's 64 MB /dev/shm (system RAM, not VRAM)
    shm_size: "2gb"

    networks:
      - ollama-net

networks:
  ollama-net:
    external: true
